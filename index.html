<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ld-theme')
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>लोकलDen — Rent Gaming & Music Gear in Bangalore</title>
    <meta name="description" content="Rent PS5, Xbox, Guitars, Keyboards and more from real people in Bangalore. Affordable. Verified. Delivered." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
      #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#07080f;transition:opacity .35s ease}
      #splash.hide{opacity:0;pointer-events:none}
      .splash-mark{width:84px;height:84px;background:url(/favicon.svg) center/contain no-repeat;animation:splashPulse 1.6s ease-in-out infinite;filter:drop-shadow(0 0 22px rgba(191,36,199,.45))}
      .splash-bar{width:120px;height:3px;border-radius:3px;background:linear-gradient(90deg,#ff1666,#bf24c7,#5486f7,#00e5ff);background-size:200% 100%;animation:splashBar 1.2s linear infinite}
      @keyframes splashPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
      @keyframes splashBar{to{background-position:-200% 0}}
    </style>
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#07080f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
